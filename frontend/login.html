<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ink Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600;700&family=Padauk:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: "#1c1524",
              paper: "#f4ead8",
              marigold: "#e39b12",
              plum: "#6b3f7a",
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="login" class="min-h-screen">
    <div id="app-header"></div>

    <main class="mx-auto max-w-md px-4 pb-16 pt-6">
      <section class="paper-card rounded-3xl p-6 sm:p-8">
        <p class="text-xs font-semibold uppercase tracking-[0.2em] text-plum" data-i18n="auth.kicker">
          Member access
        </p>
        <h1 class="display mt-2 text-3xl font-bold text-ink" data-i18n="auth.title">Welcome back</h1>
        <p class="mt-2 text-sm text-ink/70" data-i18n="auth.subtitle">
          Sign in if you are approved, or create an account and wait for an admin.
        </p>

        <div class="mt-6 grid grid-cols-2 rounded-2xl bg-paper p-1">
          <button
            type="button"
            id="tab-login"
            class="rounded-xl px-3 py-2 text-sm font-semibold ink-btn"
            data-i18n="auth.tabLogin"
          >
            Log in
          </button>
          <button
            type="button"
            id="tab-register"
            class="rounded-xl px-3 py-2 text-sm font-semibold text-ink/70"
            data-i18n="auth.tabRegister"
          >
            Register
          </button>
        </div>

        <form id="login-form" class="mt-6 space-y-4">
          <label class="block text-sm font-medium">
            <span data-i18n="auth.email">Email</span>
            <input
              type="email"
              name="email"
              required
              autocomplete="email"
              class="mt-1 w-full rounded-xl border border-ink/10 bg-white px-3 py-2.5 outline-none ring-marigold focus:ring-2"
            />
          </label>
          <label class="block text-sm font-medium">
            <span data-i18n="auth.password">Password</span>
            <input
              type="password"
              name="password"
              required
              minlength="6"
              autocomplete="current-password"
              class="mt-1 w-full rounded-xl border border-ink/10 bg-white px-3 py-2.5 outline-none ring-marigold focus:ring-2"
            />
          </label>
          <button type="submit" class="ink-btn w-full rounded-xl px-4 py-3 text-sm font-semibold" data-i18n="auth.loginBtn">
            Log in
          </button>
        </form>

        <form id="register-form" class="mt-6 hidden space-y-4">
          <label class="block text-sm font-medium">
            <span data-i18n="auth.email">Email</span>
            <input
              type="email"
              name="email"
              required
              autocomplete="email"
              class="mt-1 w-full rounded-xl border border-ink/10 bg-white px-3 py-2.5 outline-none ring-marigold focus:ring-2"
            />
          </label>
          <label class="block text-sm font-medium">
            <span data-i18n="auth.password">Password</span>
            <input
              type="password"
              name="password"
              required
              minlength="6"
              autocomplete="new-password"
              class="mt-1 w-full rounded-xl border border-ink/10 bg-white px-3 py-2.5 outline-none ring-marigold focus:ring-2"
            />
          </label>
          <p class="text-xs text-ink/60" data-i18n="auth.registerHint">
            After you register, an admin must approve you before you can log in.
          </p>
          <button type="submit" class="gold-btn w-full rounded-xl px-4 py-3 text-sm font-semibold" data-i18n="auth.registerBtn">
            Create account
          </button>
        </form>

        <p id="auth-message" class="mt-4 hidden rounded-xl px-3 py-2 text-sm"></p>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../backend/supabase.js"></script>
    <script src="../backend/api.js"></script>
    <script src="script.js"></script>
  </body>
</html>

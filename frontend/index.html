<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ink Studio — Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600;700&family=Padauk:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: "#1c1524",
              paper: "#f4ead8",
              marigold: "#e39b12",
              plum: "#6b3f7a",
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="dashboard" class="min-h-screen">
    <div id="app-header"></div>

    <main class="mx-auto max-w-5xl px-4 pb-20 pt-4">
      <section class="mb-6">
        <p class="text-xs font-semibold uppercase tracking-[0.2em] text-plum" data-i18n="dash.kicker">
          Studio
        </p>
        <h1 class="display mt-1 text-3xl font-bold sm:text-4xl" data-i18n="dash.title">
          Turn a photo into a cartoon
        </h1>
        <p class="mt-2 max-w-2xl text-sm text-ink/70 sm:text-base" data-i18n="dash.subtitle">
          Upload one image. Gemini redraws it as an illustration. Download it, then reset to start again.
        </p>
      </section>

      <section class="grid gap-5 lg:grid-cols-2">
        <div class="paper-card rounded-3xl p-5 sm:p-6">
          <h2 class="text-lg font-semibold" data-i18n="dash.uploadTitle">Your photo</h2>
          <label
            id="drop-zone"
            class="dashed-drop mt-4 flex min-h-[240px] cursor-pointer flex-col items-center justify-center rounded-2xl px-4 py-8 text-center"
          >
            <input id="image-input" type="file" accept="image/*" class="hidden" />
            <span class="text-4xl" aria-hidden="true">✎</span>
            <span class="mt-3 text-sm font-medium" data-i18n="dash.dropLabel">Tap to choose an image</span>
            <span class="mt-1 text-xs text-ink/55" data-i18n="dash.dropHint">JPG, PNG, or WEBP. One file at a time.</span>
          </label>
          <img id="preview-image" alt="" class="mt-4 hidden max-h-72 w-full rounded-2xl object-contain" />
          <button
            id="transform-btn"
            type="button"
            disabled
            class="ink-btn mt-4 flex w-full items-center justify-center gap-2 rounded-xl px-4 py-3 text-sm font-semibold disabled:cursor-not-allowed disabled:opacity-40"
          >
            <span data-i18n="dash.transform">Make cartoon</span>
          </button>
        </div>

        <div class="paper-card rounded-3xl p-5 sm:p-6">
          <h2 class="text-lg font-semibold" data-i18n="dash.resultTitle">Result</h2>
          <div id="result-empty" class="mt-4 rounded-2xl bg-paper px-4 py-16 text-center text-sm text-ink/55" data-i18n="dash.resultEmpty">
            Your cartoon will appear here.
          </div>
          <div id="result-wrap" class="mt-4 hidden">
            <img id="result-image" alt="" class="max-h-80 w-full rounded-2xl object-contain" />
            <p id="result-story" class="mt-3 hidden whitespace-pre-wrap text-sm leading-relaxed text-ink/80"></p>
            <div class="mt-4 flex flex-col gap-2 sm:flex-row">
              <button id="download-btn" type="button" class="gold-btn flex-1 rounded-xl px-4 py-3 text-sm font-semibold" data-i18n="dash.download">
                Download
              </button>
              <button id="reset-btn" type="button" class="flex-1 rounded-xl border border-ink/15 px-4 py-3 text-sm font-semibold" data-i18n="dash.reset">
                Reset
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../backend/supabase.js"></script>
    <script src="../backend/api.js"></script>
    <script src="script.js"></script>
  </body>
</html>

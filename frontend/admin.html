<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ink Studio — Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600;700&family=Padauk:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: "#1c1524",
              paper: "#f4ead8",
              marigold: "#e39b12",
              plum: "#6b3f7a",
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="admin" class="min-h-screen">
    <div id="app-header"></div>

    <main class="mx-auto max-w-4xl px-4 pb-20 pt-4">
      <section id="admin-login" class="mx-auto max-w-md paper-card rounded-3xl p-6 sm:p-8">
        <p class="text-xs font-semibold uppercase tracking-[0.2em] text-plum" data-i18n="admin.kicker">
          Admin
        </p>
        <h1 class="display mt-2 text-3xl font-bold" data-i18n="admin.loginTitle">Staff desk</h1>
        <p class="mt-2 text-sm text-ink/70" data-i18n="admin.loginSubtitle">
          Separate from member accounts. Use the hardcoded admin credentials.
        </p>
        <form id="admin-login-form" class="mt-6 space-y-4">
          <label class="block text-sm font-medium">
            <span data-i18n="auth.email">Email</span>
            <input
              type="email"
              name="email"
              required
              class="mt-1 w-full rounded-xl border border-ink/10 bg-white px-3 py-2.5 outline-none ring-marigold focus:ring-2"
            />
          </label>
          <label class="block text-sm font-medium">
            <span data-i18n="auth.password">Password</span>
            <input
              type="password"
              name="password"
              required
              class="mt-1 w-full rounded-xl border border-ink/10 bg-white px-3 py-2.5 outline-none ring-marigold focus:ring-2"
            />
          </label>
          <button type="submit" class="ink-btn w-full rounded-xl px-4 py-3 text-sm font-semibold" data-i18n="admin.loginBtn">
            Enter admin
          </button>
        </form>
        <p id="admin-login-message" class="mt-4 hidden rounded-xl px-3 py-2 text-sm"></p>
      </section>

      <section id="admin-panel" class="hidden">
        <div class="mb-5 flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
          <div>
            <h1 class="display text-3xl font-bold" data-i18n="admin.panelTitle">Approvals</h1>
            <p class="mt-1 text-sm text-ink/70" data-i18n="admin.panelSubtitle">
              Review pending members, then approve, reject, or delete.
            </p>
          </div>
          <button
            id="admin-logout"
            type="button"
            class="rounded-xl border border-ink/15 px-4 py-2 text-sm font-semibold"
            data-i18n="nav.logout"
          >
            Log out
          </button>
        </div>

        <div class="mb-4 flex flex-wrap gap-2">
          <button type="button" data-filter="pending" class="filter-btn ink-btn rounded-full px-4 py-1.5 text-sm font-semibold">
            <span data-i18n="admin.filterPending">Pending</span>
          </button>
          <button type="button" data-filter="all" class="filter-btn rounded-full border border-ink/15 px-4 py-1.5 text-sm font-semibold">
            <span data-i18n="admin.filterAll">All users</span>
          </button>
        </div>

        <div id="users-list" class="space-y-3"></div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../backend/supabase.js"></script>
    <script src="../backend/api.js"></script>
    <script src="script.js"></script>
  </body>
</html>
